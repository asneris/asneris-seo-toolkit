version: '3.8'

services:
  # WordPress 5.8 for minimum version testing
  wp58:
    image: wordpress:5.8-php7.4-apache
    container_name: asneris-wp58
    ports:
      - "8058:80"
    environment:
      WORDPRESS_DB_HOST: db58
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress58
      WORDPRESS_DEBUG: 1
    volumes:
      - wp58_data:/var/www/html
    depends_on:
      - db58
    networks:
      - wp58_network

  db58:
    image: mysql:5.7
    container_name: asneris-db58
    environment:
      MYSQL_DATABASE: wordpress58
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db58_data:/var/lib/mysql
    networks:
      - wp58_network

  # WordPress 6.0 for minimum version testing
  wp60:
    image: wordpress:6.0-php8.0-apache
    container_name: asneris-wp60
    ports:
      - "8060:80"
    environment:
      WORDPRESS_DB_HOST: db60
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress60
      WORDPRESS_DEBUG: 1
    volumes:
      - ./docker-php-config.ini:/usr/local/etc/php/conf.d/custom.ini
      - wp60_data:/var/www/html
    depends_on:
      - db60
    networks:
      - wp60_network

  db60:
    image: mysql:8.0
    container_name: asneris-db60
    environment:
      MYSQL_DATABASE: wordpress60
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db60_data:/var/lib/mysql
    networks:
      - wp60_network

  # WordPress 6.1 for current version testing
  wp61:
    image: wordpress:6.1-php7.4-apache
    container_name: asneris-wp61
    ports:
      - "8061:80"
    environment:
      WORDPRESS_DB_HOST: db61
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress61
      WORDPRESS_DEBUG: 1
    volumes:
      - ./docker-php-config.ini:/usr/local/etc/php/conf.d/custom.ini
      - wp61_data:/var/www/html
    depends_on:
      - db61
    networks:
      - wp61_network

  db61:
    image: mysql:5.7
    container_name: asneris-db61
    environment:
      MYSQL_DATABASE: wordpress61
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db61_data:/var/lib/mysql
    networks:
      - wp61_network

  # WordPress 6.4 (latest) for future compatibility
  wp64:
    image: wordpress:6.4-php8.1-apache
    container_name: asneris-wp64
    ports:
      - "8064:80"
    environment:
      WORDPRESS_DB_HOST: db64
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress64
      WORDPRESS_DEBUG: 1
    volumes:
      - ./docker-php-config.ini:/usr/local/etc/php/conf.d/custom.ini
      - wp64_data:/var/www/html
    depends_on:
      - db64
    networks:
      - wp64_network

  db64:
    image: mysql:8.0
    container_name: asneris-db64
    environment:
      MYSQL_DATABASE: wordpress64
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db64_data:/var/lib/mysql
    networks:
      - wp64_network

  # WordPress 6.9 (latest) for forward compatibility
  wp69:
    image: wordpress:6.9-php8.3-apache
    container_name: asneris-wp69
    ports:
      - "8069:80"
    environment:
      WORDPRESS_DB_HOST: db69
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress69
      WORDPRESS_DEBUG: 1
    volumes:
      - ./docker-php-config.ini:/usr/local/etc/php/conf.d/custom.ini
      - wp69_data:/var/www/html
    depends_on:
      - db69
    networks:
      - wp69_network

  db69:
    image: mysql:8.0
    container_name: asneris-db69
    environment:
      MYSQL_DATABASE: wordpress69
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db69_data:/var/lib/mysql
    networks:
      - wp69_network

